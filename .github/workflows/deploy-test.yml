name: Deploy Test

on:
  push:
    branches: [test]
    paths:
      - 'src/LpgErp.Api/**'
      - 'src/LpgErp.Application/**'
      - 'src/LpgErp.Domain/**'
      - 'src/LpgErp.Infrastructure/**'
      - 'src/LpgErp.WebApp/**'
      - 'deployments/**'
      - '.github/workflows/deploy-test.yml'
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy-test:
    needs: verify
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy test stack to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/LpgErp-test || { echo "~/LpgErp-test not found — run the first-time setup in deployments/README.md"; exit 1; }

            COMPOSE="docker compose -p lpgerp-test --env-file deployments/.env.test -f deployments/docker-compose.test.yml"

            echo "=== Pulling latest code from test ==="
            git fetch origin test
            git reset --hard origin/test

            echo "=== Building images ==="
            $COMPOSE build

            echo "=== Starting new containers ==="
            $COMPOSE up -d --remove-orphans

            echo "=== Smoke test ==="
            WEB_PORT=$(grep -E '^TEST_WEB_PORT=' deployments/.env.test | cut -d= -f2- | tr -d '"' || true)
            WEB_PORT=${WEB_PORT:-8080}
            code=000
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${WEB_PORT}/" || echo 000)
              [ "$code" = "200" ] && break
              echo "waiting for web ($i/30, last=$code)"; sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "Web did not come up (last status $code)"; $COMPOSE logs --tail=80; exit 1
            fi

            api=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${WEB_PORT}/api/v1/customers" || echo 000)
            if [ "$api" = "000" ] || [ "$api" -ge 500 ]; then
              echo "API not healthy (status $api)"; $COMPOSE logs --tail=80 api; exit 1
            fi
            echo "web=200 api=$api"

            docker image prune -f
            echo "=== Test deployment complete ==="
